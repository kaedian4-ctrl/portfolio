<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Document</title>
</head>
<body>
    <div class="slideshow-container">
        <div class="gallery">
            <div class = numbertext>1 / 6</div>
            <img src="https://shorturl.at/NaANM" alt="Mercedes" width="100%">
        </div>
        <div class="gallery">
            <div class = numbertext>2 / 6</div>
            <img src="https://shorturl.at/78MFV" alt="BMW M4" width="100%">
        </div>
        <div class="gallery">
            <div class = numbertext>3 / 6</div>
            <img src="https://shorturl.at/SY233" alt="Audi R8" width="100%">
        </div>
        <div class="gallery">
            <div class = numbertext>4 / 6</div>
            <img src="https://shorturl.at/d0WkD" alt="Koenigsegg Jesko" width="100%">
        </div>
        <div class="gallery">
            <div class = numbertext>5 / 6</div>
            <img src="https://shorturl.at/AyGHA" alt="Porsche 911" width="100%">
        </div>
        <div class="gallery">
            <div class = numbertext>6 / 6</div>
            <img src="https://tinyurl.com/4yyeaezj" alt="Corvette" width="100%">
        </div>
    </div>
    <a class="prev" onclick="plusSlides(-1)">&#10094;</a>
    <a class="next" onclick="plusSlides(1)">&#10095;</a>

    <div class="caption-container">
        <p id="caption"></p>
    </div>

    <div class="row">
        <div class="column">
            <img class="demo" src="https://shorturl.at/NaANM" alt="Mercedes" onclick="currentSlide(1)">
        </div>
        <div class="column">
            <img class="demo" src="https://shorturl.at/78MFV" alt="BMW M4" onclick="currentSlide(2)">
        </div>
        <div class="column">
            <img class="demo" src="https://shorturl.at/SY233" alt="Audi R8" onclick="currentSlide(3)">
        </div>
        <div class="column">
            <img class="demo" src="https://shorturl.at/d0WkD" alt="Koenigsegg Jesko" onclick="currentSlide(4)">
        </div>
        <div class="column">
            <img class="demo" src="https://shorturl.at/AyGHA" alt="Porsche 911" onclick="currentSlide(5)">
        </div>
        <div class="column">
            <img class="demo" src="https://tinyurl.com/4yyeaezj" alt="Corvette" onclick="currentSlide(6)">
        </div>
    </div>


<script>
    let slideIndex = 1;
    showSlides(slideIndex);

    function plusSlides(n) {
    showSlides(slideIndex += n);
    }

    function currentSlide(n) {
    showSlides(slideIndex = n);
    }

    function showSlides(n) {
    let i;
    let slides = document.getElementsByClassName("gallery");
    let dots = document.getElementsByClassName("demo");
    let captionText = document.getElementById("caption");
    if (n > slides.length) {slideIndex = 1}
    if (n < 1) {slideIndex = slides.length}
    for (i = 0; i < slides.length; i++) {
        slides[i].style.display = "none";
    }
    for (i = 0; i < dots.length; i++) {
        dots[i].className = dots[i].className.replace(" active", "");
    }
    slides[slideIndex-1].style.display = "block";
    dots[slideIndex-1].className += " active";
    captionText.innerHTML = dots[slideIndex-1].alt;
    }
</script>
</body>
</html>
